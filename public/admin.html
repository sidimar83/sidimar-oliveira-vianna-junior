<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel administrativo</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0d101b;color:#fff}.w{max-width:1100px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.p{background:#181d2d;padding:20px;border:1px solid #2c3348;border-radius:14px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}input,textarea,select,button{padding:12px;border-radius:8px;border:1px solid #343c55;font:inherit}input,textarea,select{width:100%;margin:5px 0;background:#0f1422;color:#fff}textarea{min-height:90px}button{background:#6d5dfc;color:#fff;cursor:pointer;margin:5px 4px 5px 0}.danger{background:#bd3650}.secondary{background:#384057}.ok{color:#65e6ae}.erro{color:#ff8797}.hide{display:none}.produto{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center}.produto img{width:90px;height:75px;object-fit:cover;border-radius:9px;background:#0d101b}.tabs{display:flex;flex-wrap:wrap;gap:6px}.tabs button.ativo{outline:2px solid #bdb5ff}@media(max-width:650px){.produto{grid-template-columns:1fr}.produto img{width:100%;height:180px}}</style><style>
/* Feedback de acionamento sem alterar o transform usado no posicionamento. */
:where(button, input[type="button"], input[type="submit"], input[type="reset"], a.btn, a.preview-cta, a[role="button"], a[href^="https://wa.me/"]) {
  transition: scale 120ms ease, translate 120ms ease, box-shadow 120ms ease;
}
:where(button, input[type="button"], input[type="submit"], input[type="reset"], a.btn, a.preview-cta, a[role="button"], a[href^="https://wa.me/"]):active:not(:disabled):not([aria-disabled="true"]) {
  scale: .96;
  translate: 0 2px;
  box-shadow: inset 0 0 0 2px currentColor !important;
}
:where(button, input[type="button"], input[type="submit"], input[type="reset"], a.btn, a.preview-cta, a[role="button"], a[href^="https://wa.me/"]):focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 3px;
}
@media (prefers-reduced-motion: reduce) {
  :where(button, input[type="button"], input[type="submit"], input[type="reset"], a.btn, a.preview-cta, a[role="button"], a[href^="https://wa.me/"]) { transition: none; }
  :where(button, input[type="button"], input[type="submit"], input[type="reset"], a.btn, a.preview-cta, a[role="button"], a[href^="https://wa.me/"]):active { scale: none; translate: none; }
}
</style></head><body><div class="w"><div class="top"><h1>Painel administrativo</h1><a href="/" style="color:#bdb5ff">Ver site</a> &nbsp; <a href="/platform.html" style="color:#bdb5ff">Clientes e projetos</a></div><div class="p" id="login"><input id="email" type="email" placeholder="E-mail"><input id="senha" type="password" placeholder="Senha"><button onclick="entrar()">Entrar</button><button class="secondary" onclick="recuperarSenha()">Esqueci minha senha</button><p id="erro" class="erro"></p></div><main class="hide" id="painel"><div class="top"><div class="tabs"><button onclick="aba('produtos',this)" class="ativo">Produtos</button><button onclick="aba('mensagens',this)">Mensagens</button><button onclick="aba('site',this)">Configurações</button><button onclick="aba('seguranca',this)">Segurança</button></div><button class="secondary" onclick="sair()">Sair</button></div><section id="produtos"><div class="p"><h2 id="tituloForm">Novo produto ou serviço</h2><input id="produtoId" type="hidden"><div class="grid"><div><label>Nome</label><input id="nome" placeholder="Nome" required><label>Preço</label><input id="preco" type="number" min="0" step="0.01" placeholder="0,00"><label><input id="ativo" type="checkbox" checked style="width:auto"> Visível no site</label></div><div><label>Descrição</label><textarea id="descricao" placeholder="Descrição"></textarea><label>Imagem (URL ou arquivo)</label><input id="imagemUrl" placeholder="https://..."><input id="imagemArquivo" type="file" accept="image/*" onchange="lerImagem(this)"></div></div><button onclick="salvarProduto()">Salvar produto</button><button class="secondary" onclick="limparProduto()">Limpar</button><p id="produtoMsg"></p></div><div id="lista"></div></section><section id="mensagens" class="hide"><h2>Mensagens recebidas</h2><div id="listaMensagens"></div></section><section id="site" class="hide"><div class="p"><h2>Dados e aparência do site</h2><div class="grid"><div><label>Nome da empresa</label><input id="cfgNome"><label>Título principal</label><input id="cfgTitulo"><label>Descrição</label><textarea id="cfgDescricao"></textarea></div><div><label>Telefone</label><input id="cfgTelefone"><label>E-mail</label><input id="cfgEmail"><label>Cor principal</label><input id="cfgCor" type="color"><label>Fonte</label><select id="cfgFonte"><option>Arial</option><option>Verdana</option><option>Georgia</option><option>Tahoma</option><option>Trebuchet MS</option></select></div></div><button onclick="salvarConfig()">Salvar configurações</button><p id="configMsg"></p><small>Essas informações ficam registradas no banco. Uma versão futura poderá aplicar todas elas automaticamente ao HTML sem nova exportação.</small></div></section><section id="seguranca" class="hide"><div class="p"><h2>Alterar senha</h2><input id="senhaAtual" type="password" placeholder="Senha atual"><input id="senhaNova" type="password" placeholder="Nova senha (mínimo 8 caracteres)"><button onclick="trocarSenha()">Alterar senha</button><p id="senhaMsg"></p></div></section></main></div><script>let token=localStorage.getItem('sitefacil-token')||'';const h=()=>({'Content-Type':'application/json',Authorization:'Bearer '+token});const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...h(),...(opt.headers||{})}});if(r.status===401){sair();throw Error('Sessão encerrada. Entre novamente.')}const data=r.status===204?null:await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Não foi possível concluir.');return data}async function entrar(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:senha.value})}),j=await r.json();if(!r.ok)throw Error(j.error);token=j.token;localStorage.setItem('sitefacil-token',token);await abrir()}catch(e){erro.textContent=e.message}}async function recuperarSenha(){if(!email.value)return erro.textContent='Informe seu e-mail.';const r=await fetch('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});const j=await r.json();erro.textContent=j.message||'Verifique seu e-mail.'}function sair(){localStorage.removeItem('sitefacil-token');token='';painel.classList.add('hide');login.classList.remove('hide')}function aba(id,btn){['produtos','mensagens','site','seguranca'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('ativo'));btn.classList.add('ativo')}async function abrir(){try{await api('/api/me');login.classList.add('hide');painel.classList.remove('hide');await Promise.all([carregarProdutos(),carregarMensagens(),carregarConfig()])}catch(e){erro.textContent=e.message}}async function carregarProdutos(){const p=await api('/api/admin/products');lista.innerHTML=p.length?p.map(x=>'<div class="p produto">'+(x.imageUrl?'<img src="'+esc(x.imageUrl)+'" alt="">':'<div></div>')+'<div><b>'+esc(x.name)+'</b><p>'+esc(x.description)+'</p><small>R$ '+Number(x.price||0).toFixed(2)+' • '+(x.active?'Visível':'Oculto')+'</small></div><div><button onclick='editarProduto('+JSON.stringify(x)+')'>Editar</button><button class="danger" onclick="excluirProduto('+x.id+')">Excluir</button></div></div>').join(''):'<div class="p">Nenhum produto cadastrado.</div>'}function editarProduto(x){produtoId.value=x.id;nome.value=x.name;descricao.value=x.description||'';preco.value=x.price||0;imagemUrl.value=x.imageUrl||'';ativo.checked=!!x.active;tituloForm.textContent='Editar produto';scrollTo({top:0,behavior:'smooth'})}function limparProduto(){produtoId.value='';nome.value='';descricao.value='';preco.value='';imagemUrl.value='';imagemArquivo.value='';ativo.checked=true;tituloForm.textContent='Novo produto ou serviço'}function lerImagem(i){const f=i.files[0];if(!f)return;if(f.size>2500000){produtoMsg.textContent='A imagem deve ter até 2,5 MB.';i.value='';return}const r=new FileReader();r.onload=()=>imagemUrl.value=r.result;r.readAsDataURL(f)}async function salvarProduto(){try{if(!nome.value.trim())throw Error('Informe o nome.');const id=produtoId.value,url=id?'/api/products/'+id:'/api/products',method=id?'PUT':'POST';await api(url,{method,body:JSON.stringify({name:nome.value.trim(),description:descricao.value.trim(),price:preco.value,imageUrl:imagemUrl.value,active:ativo.checked})});produtoMsg.textContent='Produto salvo.';limparProduto();await carregarProdutos()}catch(e){produtoMsg.textContent=e.message}}async function excluirProduto(id){if(!confirm('Excluir este produto?'))return;await api('/api/products/'+id,{method:'DELETE'});await carregarProdutos()}async function carregarMensagens(){const m=await api('/api/messages');listaMensagens.innerHTML=m.length?m.map(x=>'<div class="p"><b>'+esc(x.name)+'</b><p>'+esc(x.email)+' • '+esc(x.phone||'')+'</p><p>'+esc(x.message)+'</p><button class="danger" onclick="excluirMensagem('+x.id+')">Excluir mensagem</button><button onclick="responderMensagem('+x.id+')">Responder</button><button class="secondary" onclick="arquivarMensagem('+x.id+')">Arquivar</button></div>').join(''):'<div class="p">Nenhuma mensagem recebida.</div>'}async function responderMensagem(id){const message=prompt('Digite a resposta:');if(!message)return;await api('/api/messages/'+id+'/reply',{method:'POST',body:JSON.stringify({message})});await carregarMensagens()}async function arquivarMensagem(id){await api('/api/messages/'+id+'/archive',{method:'POST'});await carregarMensagens()}async function excluirMensagem(id){if(!confirm('Excluir esta mensagem?'))return;await api('/api/messages/'+id,{method:'DELETE'});await carregarMensagens()}async function carregarConfig(){const c=await api('/api/settings');cfgNome.value=c.name||'';cfgTitulo.value=c.title||'';cfgDescricao.value=c.description||'';cfgTelefone.value=c.phone||'';cfgEmail.value=c.email||'';cfgCor.value=c.color||'#6d5dfc';cfgFonte.value=c.font||'Arial'}async function salvarConfig(){try{await api('/api/settings',{method:'PUT',body:JSON.stringify({name:cfgNome.value,title:cfgTitulo.value,description:cfgDescricao.value,phone:cfgTelefone.value,email:cfgEmail.value,color:cfgCor.value,font:cfgFonte.value})});configMsg.textContent='Configurações salvas.'}catch(e){configMsg.textContent=e.message}}async function trocarSenha(){try{if(senhaNova.value.length<8)throw Error('A nova senha deve ter no mínimo 8 caracteres.');await api('/api/change-password',{method:'POST',body:JSON.stringify({currentPassword:senhaAtual.value,password:senhaNova.value})});senhaMsg.textContent='Senha alterada. Entre novamente.';setTimeout(sair,1200)}catch(e){senhaMsg.textContent=e.message}}if(token)abrir()</script></body></html>
