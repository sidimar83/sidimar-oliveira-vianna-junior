t}textarea{min-height:150px}button{background:#0878d1;color:white;padding:14px;border:0;border-radius:10px;font-weight:bold}footer{padding:30px;text-align:center;background:#12182b;color:white}@media(max-width:760px){nav{align-items:flex-start;gap:14px;flex-direction:column}nav div{display:flex;gap:10px;flex-wrap:wrap}nav a{margin:0}.conteudo,.conteudo.amplo{margin:20px auto;padding:28px}.conteudo.duas-colunas{grid-template-columns:1fr}.bloco.imagem-esquerda,.bloco.imagem-direita{grid-template-columns:1fr}.bloco.imagem-direita img,.bloco.imagem-direita div{grid-column:auto;grid-row:auto}}</style><style>body{font-family:Verdana,Arial;font-size:17px;color:#12182b;line-height:1}h1,h2,h3{font-family:Verdana,Arial;font-size:33px;font-weight:400;color:#002aff;text-align:center}body p{font-family:Verdana,Arial;font-size:17px;font-weight:400;color:#12182b;line-height:1;text-align:center}.sf-texto{overflow-wrap:anywhere;white-space:normal;text-align:left;line-height:1.5}.sf-texto p,.sf-texto div,.sf-texto li{font-size:inherit;color:inherit;font-family:inherit;font-weight:inherit;line-height:inherit;text-align:inherit;white-space:normal}.sf-texto p{margin:0 0 .75em}.sf-texto ul,.sf-texto ol{padding-left:1.8em;margin:.6em 0}.sf-texto ul{list-style:disc}.sf-texto ol{list-style:decimal}.sf-texto h2,.sf-texto h3,.sf-texto h4{margin:.7em 0 .4em}.sf-texto blockquote{margin-left:24px}nav{background:#ffffff!important;justify-content:space-between;gap:18px}nav a{color:#12182b!important;font-size:10px}</style><style>

:where(button, input[type="button"], input[type="submit"], input[type="reset"], a.btn, a.preview-cta, a[role="button"], a[href^="https://wa.me/"]):focus-visible {

}
