<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes e projetos</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#0d101b;color:#fff}.w{max-width:1100px;margin:auto;padding:25px}.p{background:#181d2d;border:1px solid #303750;border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}input,select,button{padding:11px;border-radius:8px;border:1px solid #39415b;margin:4px 0;width:100%;font:inherit}input,select{background:#0f1422;color:#fff}button{background:#6d5dfc;color:#fff;cursor:pointer}.danger{background:#b9344d}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#bcb4ff}</style><style>
/* Feedback de acionamento sem alterar o transform usado no posicionamento. */
:where(button, input[type="button"], input[type="submit"], input[type="reset"], a.btn, a.preview-cta, a[role="button"], a[href^="https://wa.me/"]) {
  transition: scale 120ms ease, translate 120ms ease, box-shadow 120ms ease;
}
:where(button, input[type="button"], input[type="submit"], input[type="reset"], a.btn, a.preview-cta, a[role="button"], a[href^="https://wa.me/"]):active:not(:disabled):not([aria-disabled="true"]) {
  scale: .96;
  translate: 0 2px;
  box-shadow: inset 0 0 0 2px currentColor !important;
}
:where(button, input[type="button"], input[type="submit"], input[type="reset"], a.btn, a.preview-cta, a[role="button"], a[href^="https://wa.me/"]):focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 3px;
}
@media (prefers-reduced-motion: reduce) {
  :where(button, input[type="button"], input[type="submit"], input[type="reset"], a.btn, a.preview-cta, a[role="button"], a[href^="https://wa.me/"]) { transition: none; }
  :where(button, input[type="button"], input[type="submit"], input[type="reset"], a.btn, a.preview-cta, a[role="button"], a[href^="https://wa.me/"]):active { scale: none; translate: none; }
}
</style></head><body><div class="w"><div class="top"><h1>Clientes, usuários e projetos</h1><a href="/admin">Voltar ao painel</a></div><p id="msg"></p><div class="grid"><section class="p"><h2>Novo cliente</h2><input id="cNome" placeholder="Nome"><input id="cDoc" placeholder="CPF ou CNPJ"><input id="cEmail" placeholder="E-mail"><input id="cPhone" placeholder="Telefone"><button onclick="criarCliente()">Cadastrar cliente</button></section><section class="p"><h2>Novo projeto</h2><input id="pNome" placeholder="Nome do projeto"><select id="pCliente"></select><select id="pStatus"><option value="draft">Rascunho</option><option value="active">Ativo</option><option value="delivered">Entregue</option></select><button onclick="criarProjeto()">Cadastrar projeto</button></section><section class="p"><h2>Novo usuário</h2><input id="uEmail" type="email" placeholder="E-mail"><input id="uSenha" type="password" placeholder="Senha inicial"><select id="uCliente"></select><button onclick="criarUsuario()">Cadastrar usuário do cliente</button></section></div><h2>Clientes</h2><div id="clientes"></div><h2>Projetos</h2><div id="projetos"></div><h2>Usuários</h2><div id="usuarios"></div></div><script>const token=localStorage.getItem('sitefacil-token')||'';const h={'Content-Type':'application/json',Authorization:'Bearer '+token};const esc=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function api(url,opt={}){const r=await fetch(url,{...opt,headers:h}),j=r.status===204?null:await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Não foi possível concluir');return j}async function carregar(){try{const[c,p,u]=await Promise.all([api('/api/customers'),api('/api/site-projects'),api('/api/users')]);const opts='<option value="">Selecione o cliente</option>'+c.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');pCliente.innerHTML=opts;uCliente.innerHTML=opts;clientes.innerHTML=c.map(x=>'<div class="p"><b>'+esc(x.name)+'</b><p>'+esc(x.document)+' • '+esc(x.email)+'</p><small>'+x._count.projects+' projeto(s) • '+x._count.users+' usuário(s)</small><button class="danger" onclick="remover('/api/customers/'+x.id+'')">Excluir</button></div>').join('')||'<div class="p">Nenhum cliente.</div>';projetos.innerHTML=p.map(x=>'<div class="p"><b>'+esc(x.name)+'</b><p>Cliente: '+esc(x.customer.name)+' • Status: '+esc(x.status)+'</p><button class="danger" onclick="remover('/api/site-projects/'+x.id+'')">Excluir</button></div>').join('')||'<div class="p">Nenhum projeto.</div>';usuarios.innerHTML=u.map(x=>'<div class="p"><b>'+esc(x.email)+'</b><p>Perfil: '+esc(x.role)+'</p><button class="danger" onclick="remover('/api/users/'+x.id+'')">Excluir</button></div>').join('')}catch(e){msg.textContent=e.message}}async function criarCliente(){try{await api('/api/customers',{method:'POST',body:JSON.stringify({name:cNome.value,document:cDoc.value,email:cEmail.value,phone:cPhone.value})});cNome.value=cDoc.value=cEmail.value=cPhone.value='';carregar()}catch(e){msg.textContent=e.message}}async function criarProjeto(){try{await api('/api/site-projects',{method:'POST',body:JSON.stringify({name:pNome.value,customerId:pCliente.value,status:pStatus.value})});pNome.value='';carregar()}catch(e){msg.textContent=e.message}}async function criarUsuario(){try{await api('/api/users',{method:'POST',body:JSON.stringify({email:uEmail.value,password:uSenha.value,customerId:uCliente.value,role:'client'})});uEmail.value=uSenha.value='';carregar()}catch(e){msg.textContent=e.message}}async function remover(url){if(!confirm('Confirma a exclusão?'))return;try{await api(url,{method:'DELETE'});carregar()}catch(e){msg.textContent=e.message}}if(!token){location.href='/admin'}else carregar()</script></body></html>
